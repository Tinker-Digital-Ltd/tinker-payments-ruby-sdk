AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  Exclude:
    - 'vendor/**/*'
    - 'spec/spec_helper.rb'
    - 'bin/**/*'
    - 'tmp/**/*'
    - '*.gemspec'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'

Naming/FileName:
  Exclude:
    - 'lib/tinker.rb'

