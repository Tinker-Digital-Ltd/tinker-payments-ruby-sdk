name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.0', '3.1', '3.2', '3.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run linter
        continue-on-error: true
        uses: rubocop/rubocop-github-action@v2
        with:
          working-directory: .
          files: 'lib/**/*.rb'
          fail-on-error: true
          autocorrect: true
          format: progress
          color: true
          verbose: false
          
      - name: Run tests
        run: bundle exec rspec

     

